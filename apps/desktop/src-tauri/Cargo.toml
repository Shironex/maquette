[package]
name = "maquette-desktop"
description = "Maquette desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
default-run = "maquette-desktop"

[lib]
# The shell is a library so commands stay unit-testable; the binary is a
# three-line entry point.
name = "maquette_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
maquette-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
specta = { workspace = true }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
getrandom = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
tokio-util = { workspace = true }
tower-service = { workspace = true }
keyring-core = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
