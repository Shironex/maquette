[package]
name = "maquette-core"
description = "Maquette domain logic: toolchain detection, workspace config, projects, pipelines, the model inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
glob = { workspace = true }
gltf = { workspace = true }
hex = { workspace = true }
notify = { workspace = true }
process-wrap = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Only for the CREATE_NO_WINDOW flag type process-wrap takes; the same
# release process-wrap already pulls in.
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
