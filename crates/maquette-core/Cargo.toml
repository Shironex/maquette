[package]
name = "maquette-core"
description = "Maquette domain logic: toolchain detection, workspace config, projects, pipelines, the model inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
glob = { workspace = true }
gltf = { workspace = true }
hex = { workspace = true }
# The frame proxy in front of the Page view's dev server, on its own small
# runtime: the same hyper and tokio the desktop shell serves MCP with.
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
notify = { workspace = true }
process-wrap = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Only for the CREATE_NO_WINDOW flag type process-wrap takes; the same
# release process-wrap already pulls in.
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
