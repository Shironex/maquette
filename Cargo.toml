# Maquette: Rust workspace.
#
# The domain crates under `crates/` own the backend logic, and
# `apps/desktop/src-tauri` is a thin composition root that wires them into the
# Tauri shell. Dependencies run one way: core -> desktop.

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Shironex"]
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
maquette-core = { path = "crates/maquette-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

# Content hashes for the step cache.
sha2 = "0.10.9"
hex = "0.4.3"
glob = "0.3.4"
# GLB analysis. Only the parser and the accessor readers, no image decoding.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extensions", "extras", "allow_empty_texture"] }
# The inbox watcher. notify 9 is still a release candidate.
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
# Spawns pipeline steps in their own process group (Unix) or job object
# (Windows), so cancel kills the whole tree.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags", "kill-on-drop"] }

# The built in MCP server. rmcp 3.6 and 3.7 are younger than seven days,
# so this stays on 3.5.1. It is served by plain hyper on 127.0.0.1.
rmcp = { version = "=3.5.1", default-features = false }
schemars = "1.2.2"
tokio = { version = "1.53", default-features = false }
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
getrandom = "0.3.4"
http-body-util = "0.1.3"
tokio-util = { version = "0.7.15", default-features = false }
tower-service = "0.3.3"

tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2.7"

# Exact pins: tauri-specta is pre-1.0, and a floating rc would resolve
# differently between machines and break the regenerate-and-diff guard.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
await_holding_lock = "warn"
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
