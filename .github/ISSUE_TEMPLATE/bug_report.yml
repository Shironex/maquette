name: Bug report
description: Something in the app is broken or behaves unexpectedly.
labels: ['bug', 'P2-medium']
body:
  - type: markdown
    attributes:
      value: |
        For a model that comes out wrong, or a pipeline step that fails, use the model and pipeline form instead. This one is for the app itself: a crash, a view that misbehaves, a setting that does not stick.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Board of a project
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Maquette version
      description: The version of the build you run. The installer file name and the release page show it.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.2, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: How you run it
      options:
        - Release build
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: sync
    attributes:
      label: Is the workspace synced between two computers?
      description: A workspace in a Syncthing folder shared by two machines. Sync conflicts and the workspace lock behave differently from a single machine.
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Leave empty if Blender is not involved.
      placeholder: 5.0.1
  - type: dropdown
    id: provider
    attributes:
      label: Provider involved
      multiple: true
      options:
        - Tripo
        - Meshy
        - By hand
        - Codex (Concept lab)
        - None
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: A pipeline run's log is in the project's cache folder (last 5 runs). Paste the relevant lines and remove API keys, tokens and private paths. Screenshots help for anything visual.
      render: text
