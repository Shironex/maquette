# Builds, signs and publishes a release when a `vX.Y.Z` tag is pushed.
# docs/publishing.md ("Cut a release") is the walkthrough.
#
#   version  the tag matches the version in every file that carries it
#   build    macOS (Apple silicon) and Windows installers, signed for the
#            updater with the key from the `release` environment
#   draft    verifies every signature against the public key the app ships
#            with, writes latest.json once (two build jobs writing it in turn
#            race and can drop a platform), and uploads all of it to a draft
#            release with the notes from docs/releases/vX.Y.Z.md
#   publish  waits for a second approval of the `release` environment, so the
#            draft can be looked at first, verifies the uploaded files again
#            and publishes the draft
#
# Run by hand (workflow_dispatch) it is a dry run: from a branch it builds
# unsigned installers and keeps them as workflow artifacts, since the
# `release` environment and its key only admit `v*` tags. It never creates or
# publishes a release.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel a release halfway; a second run for the same ref waits.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check · version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The tag matches every version file
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            node scripts/release/bump-version.mjs --check "$REF_NAME"
          else
            node scripts/release/bump-version.mjs --check
          fi
          version=$(node scripts/release/bump-version.mjs --print)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: build · ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # The signing key lives in the `release` environment, which admits only
    # `v*` tags and asks for approval. A dry run from a branch builds unsigned
    # without it.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      SIGNED: ${{ github.ref_type == 'tag' }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rust-toolchain.toml pins the channel; the target is the runner's own.
      # No Rust cache: a release builds with LTO from scratch, and a cache
      # written on a tag could not be read by the next tag anyway.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
        shell: bash
      - name: Stamp the commit and date shown in About
        shell: bash
        run: |
          echo "MAQUETTE_COMMIT=${GITHUB_SHA::10}" >> "$GITHUB_ENV"
          echo "MAQUETTE_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      # Build only: without tagName or releaseId the action creates no release
      # and uploads nothing. The draft job below does that once, for both.
      # tauri.updater.conf.json turns on createUpdaterArtifacts, which signs
      # the update files with the key below (docs/publishing.md).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: >-
            --target ${{ matrix.target }}
            ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.updater.conf.json' || '' }}
      # The macOS update archive is renamed to carry the version and arch, as
      # latest.json names it; a signature covers the bytes, not the name.
      - name: Collect the installers
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          mkdir -p out
          case "$TARGET" in
            aarch64-apple-darwin)
              cp "$bundle"/dmg/*.dmg out/
              if [ "$SIGNED" = true ]; then
                cp "$bundle/macos/Maquette.app.tar.gz" "out/Maquette_${VERSION}_aarch64.app.tar.gz"
                cp "$bundle/macos/Maquette.app.tar.gz.sig" "out/Maquette_${VERSION}_aarch64.app.tar.gz.sig"
              fi
              ;;
            x86_64-pc-windows-msvc)
              cp "$bundle"/nsis/*-setup.exe out/
              if [ "$SIGNED" = true ]; then
                cp "$bundle"/nsis/*-setup.exe.sig out/
              fi
              ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: verify · draft
    needs: [version, build]
    # Only a pushed tag makes a release. A signed run by hand on a tag still
    # verifies the signatures, then stops before the draft.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install minisign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release-assets
      - name: Release notes
        run: >-
          node scripts/release/release-notes.mjs "$VERSION"
          --title "$RUNNER_TEMP/title.txt" --body "$RUNNER_TEMP/notes.md"
      - name: Write latest.json
        env:
          REPO: ${{ github.repository }}
        run: >-
          node scripts/release/latest-json.mjs --dir release-assets --version "$VERSION"
          --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md" --out release-assets/latest.json
      - name: Verify every signature against the shipped public key
        run: node scripts/release/verify-signatures.mjs release-assets --version "$VERSION"
      - name: Create or update the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          title=$(cat "$RUNNER_TEMP/title.txt")
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$TAG is already published. Never re-release a version; bump it instead."
              exit 1
            fi
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --draft --verify-tag \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
          echo "Draft ready: $(gh release view "$TAG" --json url --jq .url)"

  publish:
    name: publish
    needs: [version, draft]
    # Never on a run by hand: only a pushed tag publishes.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # The second approval: look at the draft, then approve this job.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install minisign
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
      # What users will download, not what the build jobs handed over.
      - name: Download the draft's files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --dir release-assets
      - name: Verify every signature against the shipped public key
        run: node scripts/release/verify-signatures.mjs release-assets --version "$VERSION"
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # releases/latest, which the updater reads, skips pre-releases.
          if [ "$PRERELEASE" = true ]; then latest=--latest=false; else latest=--latest; fi
          gh release edit "$TAG" --draft=false "$latest"
          echo "Published: $(gh release view "$TAG" --json url --jq .url)"
