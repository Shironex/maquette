# Builds the landing page and docs (apps/site) and deploys them to GitHub Pages
# at https://shironex.github.io/maquette/. Pages takes its source from GitHub
# Actions (Settings > Pages), so this workflow is the only way the site ships.
#
# It runs on a push to main that touches the site or what the site imports:
# the UI kit, the web app's Basis transcoder plugin, the app version in
# tauri.conf.json, and the toolchain and lockfile. Run it by hand to redeploy.

name: pages

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/ui/**
      - apps/web/vite/basis-transcoder.ts
      - apps/desktop/src-tauri/tauri.conf.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One deploy at a time; a deploy that has started always finishes.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build · pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The docs read each page's last commit date for their version line.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: deploy · pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
