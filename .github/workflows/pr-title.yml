# The PR title becomes the squash-merge commit subject, so it follows the same
# rules commitlint applies to every commit: `type(scope): lowercase summary`,
# a scope always, at most 100 characters.
#
# SAFETY: `pull_request_target`, so the check that runs is always the one on
# the base branch and a PR cannot edit its way past it. This workflow must
# never check out, build or run anything from the PR. It reads the title from
# the event and nothing else.

name: pr-title

on:
  pull_request_target:
    # `synchronize` too: a required check must report on every head commit.
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: pr title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
          # Keep in step with `scope-enum` in commitlint.config.mjs.
          scopes: |
            desktop
            web
            site
            ui
            core
            workspace
            deps
            docs
            scripts
          requireScope: true
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The summary "{subject}" starts with a capital letter. Write it in lowercase,
            for example `fix(core): keep the lock file out of the sync ignore list`.

      # commitlint's header-max-length, which the action above does not check.
      - name: At most 100 characters
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          length=${#TITLE}
          if [ "$length" -gt 100 ]; then
            echo "::error::The title is $length characters; the squash commit allows 100."
            exit 1
          fi
