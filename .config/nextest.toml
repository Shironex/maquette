# cargo-nextest, the Rust test runner of `pnpm gate`. No retries: a flaky test
# stays red.
[profile.default]
# Finish every test on a failure: the exports that regenerate the IPC bindings
# and tool-names.txt still run, and one gate shows all that is wrong.
fail-fast = false
# Passing tests stay quiet, so the gate's output is readable.
status-level = "slow"
final-status-level = "slow"
failure-output = "final"
